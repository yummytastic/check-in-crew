<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<rect width="100%" height="100%" fill="#F7F2EA"/>
<style>text{font-family:Arial,sans-serif;fill:#12263A}.muted{fill:#4B6172}.small{font-size:22px;fill:#4B6172}.body{font-size:25px}.head{font-size:30px;font-weight:700}.title{font-size:64px;font-weight:700}</style>
<text x="70" y="112" class="title">CHECK-IN CREW</text><text x="74" y="172" class="muted" style="font-size:28px">A community-run scheduler for recurring Reddit threads</text><line x1="74" y1="198" x2="1126" y2="198" stroke="#F05A28" stroke-width="6"/>
<rect x="70" y="220" width="500" height="380" rx="24" fill="#FFFFFF" stroke="#D9E0E3" stroke-width="2"/><text x="186" y="290" class="head">SCHEDULE</text><text x="98" y="345" class="body">Accountability: signup, daily, roundup</text><text x="98" y="389" class="body">Simple: daily or weekly posts</text><text x="98" y="433" class="body">Scheduler or AutoModerator</text>
<rect x="615" y="220" width="500" height="380" rx="24" fill="#FFFFFF" stroke="#D9E0E3" stroke-width="2"/><text x="731" y="290" class="head">HOSTS</text><text x="643" y="345" class="body">Choose maintainers or credit-only users</text><text x="643" y="389" class="body">Credit appears in post bodies</text><text x="643" y="433" class="body">Names carry forward to future months</text>
<rect x="70" y="620" width="500" height="380" rx="24" fill="#FFFFFF" stroke="#D9E0E3" stroke-width="2"/><text x="186" y="690" class="head">ACCESS</text><text x="98" y="745" class="body">Moderators manage the installation</text><text x="98" y="789" class="body">Maintainers manage assigned series</text><text x="98" y="833" class="body">Credit does not grant app access</text>
<rect x="615" y="620" width="500" height="380" rx="24" fill="#FFFFFF" stroke="#D9E0E3" stroke-width="2"/><text x="731" y="690" class="head">CONTROL</text><text x="643" y="745" class="body">Edit schedule, titles, bodies, stickies</text><text x="643" y="789" class="body">Preview before publishing</text><text x="643" y="833" class="body">Manual posting is optional</text>
<rect x="70" y="1040" width="1060" height="160" rx="26" fill="#12263A"/><text x="106" y="1110" style="font-size:30px;font-weight:700;fill:white">MODERATOR FLOW</text><text x="108" y="1155" style="font-size:22px;font-weight:700;fill:white">Install → Create series → Assign access + hosts → Test → Enable</text>
<rect x="70" y="1240" width="1060" height="350" rx="26" fill="#FFF7E5" stroke="#E8D7A9" stroke-width="2"/><text x="106" y="1310" class="head">WHY HOSTS MATTER</text><text x="106" y="1370" class="body">Hosts are volunteers who keep recurring threads welcoming and consistent.</text><text x="106" y="1410" class="body">The app credits them publicly while moderator permissions stay separate.</text><text x="106" y="1480" style="font-size:27px;font-weight:700;fill:#118A8A">Built for transparent, volunteer-led community care.</text><text x="106" y="1540" class="small">Check-In Crew · configure in the subreddit dashboard</text></svg>